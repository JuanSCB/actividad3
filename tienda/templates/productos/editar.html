{% extends "base.html" %}

{% block titulo %}Editar{% endblock %}

{% block contenido %}

<h1>Editar producto</h1>

<form method="POST">

    <p>
        <input
            name="nombre"
            value="{{ producto.nombre }}"
            required
        >
    </p>

    <p>
        <input
            name="precio"
            type="number"
            step="0.01"
            value="{{ producto.precio }}"
            required
        >
    </p>

    <button type="submit">
        Actualizar
    </button>

</form>

{% endblock %}
